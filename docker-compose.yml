name: fleet-audit

x-target: &target
  restart: unless-stopped
  volumes:
    - ./lab/keys/collector.pub:/keys/collector.pub:ro
    - ./lab/state:/lab-state          # chaves de host + marcador de cenário (persistem)
  networks: [lab]

services:
  postgres:
    image: ${POSTGRES_IMAGE}
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina no .env}
      N8N_DB_PASSWORD: ${N8N_DB_PASSWORD:?defina no .env}
      INVENTORY_RW_PASSWORD: ${INVENTORY_RW_PASSWORD:?defina no .env}
      GRAFANA_RO_PASSWORD: ${GRAFANA_RO_PASSWORD:?defina no .env}
      LOAD_LAB_SEED: ${LOAD_LAB_SEED:-false}
      TZ: ${TZ}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/00-init.sh:/docker-entrypoint-initdb.d/00-init.sh:ro
      - ./db:/schema:ro                     # migrations + seed (make migrate)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 10
    networks: [lab]

  n8n:
    image: ${N8N_IMAGE}
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
    ports:
      - "127.0.0.1:5678:5678"   # só localhost; nada exposto na rede
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: n8n
      DB_POSTGRESDB_PASSWORD: ${N8N_DB_PASSWORD}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?gere com openssl rand -hex 32}
      GENERIC_TIMEZONE: ${TZ}
      TZ: ${TZ}
      N8N_SECURE_COOKIE: "false"          # lab em http://localhost
    volumes:
      - n8ndata:/home/node/.n8n
      - ./n8n/workflows:/workflows:ro      # make import-workflows
    networks: [lab]

  # Único serviço com a chave SSH. O n8n pede a coleta por HTTP e nunca vê a chave.
  collector-gateway:
    build: ./gateway
    restart: unless-stopped
    user: "1000:1000"                      # dono da lab/keys/collector (chmod 600)
    environment:
      GATEWAY_TOKEN: ${GATEWAY_TOKEN:?gere com openssl rand -hex 24}
      SSH_HOSTKEY_POLICY: accept-new
    volumes:
      - ./collector:/collector:ro
      - ./lab/keys/collector:/keys/collector:ro
      - gatewaystate:/state                # known_hosts (TOFU)
    networks: [lab]                        # sem porta publicada

  # Única peça com o token do bot. Envia as mensagens do n8n e traz os cliques
  # nos botões (long polling: não precisa de URL pública nem webhook exposto).
  telegram-bridge:
    build: ./telegram-bridge
    restart: unless-stopped
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?token do bot (BotFather)}
      BRIDGE_TOKEN: ${BRIDGE_TOKEN:?gere com openssl rand -hex 24}
      N8N_ACTION_URL: http://n8n:5678/webhook/fleet-audit-telegram
    networks: [lab]                        # sem porta publicada

  grafana:
    image: ${GRAFANA_IMAGE}
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?defina no .env}
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/dashboards/fleet-audit.json
      GF_USERS_DEFAULT_LANGUAGE: pt-BR
      GF_DATE_FORMATS_FULL_DATE: "DD/MM/YYYY HH:mm:ss"      # padrão BR, independente do navegador
      GF_DATE_FORMATS_INTERVAL_DAY: "DD/MM"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GRAFANA_RO_PASSWORD: ${GRAFANA_RO_PASSWORD}
      TZ: ${TZ}
    volumes:
      - grafanadata:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro    # dashboards como código
    networks: [lab]

  # --- servidores-alvo simulados (acesso só por chave, sem agente) ---------
  target-debian:
    <<: *target
    build: { context: ./lab/target, dockerfile: Dockerfile.debian }
    hostname: debian-01
    environment: { CERT_DAYS: "20", FILL_DATA_MB: "58" }   # cert vencendo + /data em ~90%
    tmpfs: ["/data:size=64m"]
    ports: ["127.0.0.1:2221:22"]

  target-rocky:
    <<: *target
    build: { context: ./lab/target, dockerfile: Dockerfile.rocky }
    hostname: rocky-01
    environment: { CERT_DAYS: "365" }
    ports: ["127.0.0.1:2222:22"]

  target-alpine:
    <<: *target
    build: { context: ./lab/target, dockerfile: Dockerfile.alpine }
    hostname: alpine-01
    environment: { CERT_DAYS: "5" }                        # cert crítico
    ports: ["127.0.0.1:2223:22"]

  # --- frota extra (opcional): make fleet-up / make fleet-down --------------
  # Cada host demonstra um cenário diferente; nenhum publica porta no Windows.
  web-01:     # disco em ~88% -> ALTA
    <<: *target
    profiles: [fleet]
    build: { context: ./lab/target, dockerfile: Dockerfile.debian }
    hostname: web-01
    environment: { CERT_DAYS: "365", FILL_DATA_MB: "56" }
    tmpfs: ["/data:size=64m"]

  web-02:     # saudável
    <<: *target
    profiles: [fleet]
    build: { context: ./lab/target, dockerfile: Dockerfile.alpine }
    hostname: web-02
    environment: { CERT_DAYS: "365" }

  db-01:      # conta com UID 0 além do root -> CRÍTICA; certificado em 12 dias -> ALTA
    <<: *target
    profiles: [fleet]
    build: { context: ./lab/target, dockerfile: Dockerfile.rocky }
    hostname: db-01
    environment: { CERT_DAYS: "12", UID0_USER: "dbadmin" }

  app-01:     # saudável
    <<: *target
    profiles: [fleet]
    build: { context: ./lab/target, dockerfile: Dockerfile.debian }
    hostname: app-01
    environment: { CERT_DAYS: "90" }

  app-02:     # certificado em 25 dias -> MÉDIA
    <<: *target
    profiles: [fleet]
    build: { context: ./lab/target, dockerfile: Dockerfile.alpine }
    hostname: app-02
    environment: { CERT_DAYS: "25" }

  bkp-01:     # saudável
    <<: *target
    profiles: [fleet]
    build: { context: ./lab/target, dockerfile: Dockerfile.rocky }
    hostname: bkp-01
    environment: { CERT_DAYS: "365" }

networks:
  lab: {}

volumes:
  pgdata: {}
  n8ndata: {}
  grafanadata: {}
  gatewaystate: {}
