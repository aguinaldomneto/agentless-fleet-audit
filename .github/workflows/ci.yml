name: ci
on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck (POSIX)
        run: make lint

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        shell: [dash, "bash --posix", "busybox sh"]
    steps:
      - uses: actions/checkout@v4
      - name: instalar shells
        run: sudo apt-get update -q && sudo apt-get install -y -q dash busybox
      - name: testes com ${{ matrix.shell }}
        run: ${{ matrix.shell }} tests/run.sh

  gateway:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: testes do gateway
        run: make test-gateway

  n8n:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: Code nodes testados e sincronizados com o workflow
        run: make test-n8n

  sql:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_PASSWORD: ci }
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    env:
      PGHOST: localhost
      PGPASSWORD: ci
      POSTGRES_USER: postgres
      N8N_DB_PASSWORD: ci
      INVENTORY_RW_PASSWORD: ci
      GRAFANA_RO_PASSWORD: ci
      LOAD_LAB_SEED: "true"
      SCHEMA_DIR: ${{ github.workspace }}/db
    steps:
      - uses: actions/checkout@v4
      - name: init + migrations (como no container)
        run: sh db/00-init.sh
      - name: migrations são idempotentes
        run: sh db/migrate.sh
      - name: testes da ingestão e regras
        run: PGPASSWORD=ci psql -U inventory_rw -d inventory -X -v ON_ERROR_STOP=1 -f tests/sql/test_ingest.sql

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: validar docker-compose.yml
        run: |
          cp .env.example .env
          sed -i 's/^N8N_ENCRYPTION_KEY=$/N8N_ENCRYPTION_KEY=ci/; s/^GATEWAY_TOKEN=$/GATEWAY_TOKEN=ci/' .env
          touch lab/keys/collector lab/keys/collector.pub
          docker compose config -q
